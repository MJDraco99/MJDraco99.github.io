<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout Assignment</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container-fluid p-0" style="height: 400px; display: flex; flex-direction: column;">
      
      <div class="row g-0" style="height: 10%; background-color: #DEE3EB;"></div>
      
      <div class="row g-0" style="height: 15%; background-color: #7E8999;"></div>
      
      <div class="row g-0 flex-grow-1">
        <div class="col-4" style="background-color: #385893;"></div>
        <div class="col-8" style="background-color: #515D70;"></div>
      </div>
      
      <div class="row g-0" style="height: 12%; background-color: #43070C;"></div>
      
    </div>

</body>
</html>
